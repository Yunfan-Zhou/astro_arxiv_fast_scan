[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giiisp-arxiv-daily-reader"
version = "0.1.0"
description = "Daily Giiisp arXiv metadata and Chinese abstract-reading tasks for dots"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
figures = ["pypdf>=5,<7", "pypdfium2>=4.30,<6", "Pillow>=10,<13"]

[project.scripts]
arxiv-daily = "arxiv_daily.cli:main"

[tool.setuptools.packages.find]
include = ["arxiv_daily*"]

[tool.setuptools.package-data]
arxiv_daily = ["reader.html"]
