<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>arXiv 文献初读</title>
<style>
:root{color-scheme:light;--ink:#24312e;--muted:#67736e;--line:#dce3db;--accent:#267457}*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:var(--ink);font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:1040px;margin:auto;padding:48px 24px}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font:12px/1.5 monospace;color:var(--accent);letter-spacing:2px}h1{font-size:34px;line-height:1.3;margin:12px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:22px 0;position:sticky;top:0;background:#f7f8f3;z-index:1}input[type=search]{flex:1;min-width:200px}button,input[type=search],.import{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:white;font:inherit;font-size:14px;color:var(--ink)}button,.import{cursor:pointer}button:hover,.import:hover{border-color:var(--accent)}button[aria-pressed=true]{background:#e0efe5;color:#185d40;border-color:#8ab99c}.paper{padding:23px 0;border-bottom:1px solid var(--line)}.heading{display:flex;gap:14px;align-items:flex-start}.heading h2{font-size:20px;line-height:1.5;margin:0;flex:1}.star{min-width:88px}.original{font-size:14px;color:var(--muted);margin:8px 0}.meta{font:12px/1.6 monospace;color:var(--accent)}.reading{display:grid;grid-template-columns:48px 1fr;gap:7px 12px;margin:16px 0}.reading dt{color:var(--muted)}.reading dd{margin:0}a{color:var(--accent)}summary{cursor:pointer;color:var(--muted);font-size:14px}.abstract{font-size:14px}.warning{color:#956226}footer{padding:25px 0;font-size:13px;color:var(--muted)}@media(max-width:600px){main{padding:25px 16px}h1{font-size:28px}.toolbar{position:static}.heading h2{font-size:18px}}
</style>
<main><header><div class="eyebrow">ARXIV · ASTROPHYSICS · DAILY READING</div><h1>今日论文，轻量初读</h1><p id="subtitle"></p><p class="muted">标题与摘要的简短解读，本次未核验图表。星标保存在当前浏览器，请定期导出；不会自动同步 GitHub 或 dots。</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="搜索标题、作者、摘要或 arXiv ID" aria-label="搜索论文"><button id="only" aria-pressed="false">只看收藏</button><button id="download">下载日报 Markdown</button><button id="export">导出收藏 JSON</button><button id="exportmd">导出收藏 Markdown</button><label class="import">导入收藏<input id="import" type="file" accept=".json" hidden></label></div>
<p id="status" class="muted" role="status"></p><section id="list"></section><footer>收藏只是“以后想读”的标记。需要精读时，把 arXiv ID 或收藏清单交给 dots 即可。</footer></main>
<script id="data" type="application/json">__PAPER_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),key='arxiv-daily-favorites-v1';
let favorites={},only=false,storageOK=true;
try{favorites=JSON.parse(localStorage.getItem(key)||'{}');if(!favorites||typeof favorites!=='object'||Array.isArray(favorites))throw Error();}catch(e){favorites={};storageOK=false;}
const byId=id=>document.getElementById(id),el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
function persist(){try{localStorage.setItem(key,JSON.stringify(favorites));storageOK=true;}catch(e){storageOK=false;}}
function download(content,name,type){const a=el('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function render(){const query=byId('search').value.toLocaleLowerCase();const papers=data.papers.filter(p=>(!only||favorites[p.arxiv_id])&&[p.title,p.title_zh,p.authors_raw,p.abstract,p.arxiv_id].join(' ').toLocaleLowerCase().includes(query));const list=byId('list');list.replaceChildren();byId('status').textContent=`显示 ${papers.length} / ${data.papers.length} 篇 · 收藏 ${Object.keys(favorites).length} 篇（含历史日期）`+(storageOK?'':' · 浏览器存储不可用，请在关闭前导出收藏');
for(const p of papers){const article=el('article',undefined,'paper'),heading=el('div',undefined,'heading'),title=el('h2',`${String(p.index).padStart(3,'0')}  ${p.title_zh}`),star=el('button',favorites[p.arxiv_id]?'★ 已收藏':'☆ 收藏','star');star.setAttribute('aria-label',`收藏 ${p.arxiv_id}`);star.setAttribute('aria-pressed',String(Boolean(favorites[p.arxiv_id])));star.onclick=()=>{if(favorites[p.arxiv_id])delete favorites[p.arxiv_id];else favorites[p.arxiv_id]={arxiv_id:p.arxiv_id,title:p.title,title_zh:p.title_zh,url:p.url,version:p.version,saved_at:new Date().toISOString(),note:'',status:'to_read'};persist();render();};heading.append(title,star);article.append(heading,el('p',p.title,'original'));const meta=el('div',undefined,'meta'),link=el('a',`${p.arxiv_id}v${p.version}`);link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';meta.append(link,el('span',` · ${p.sections.join(' / ')}`));article.append(meta);const dl=el('dl',undefined,'reading');for(const [label,field]of[['问题','problem'],['方法','method'],['结果','result'],['意义','meaning']])dl.append(el('dt',label),el('dd',p[field]));article.append(dl);if(p.limitation)article.append(el('p',p.limitation,'warning'));const details=el('details');details.append(el('summary','作者与原始摘要'),el('p',p.authors_raw,'muted'),el('p',p.abstract,'abstract'));article.append(details);list.append(article);}}
byId('subtitle').textContent=`${data.date} · ${data.papers.length} 篇 · New submissions / Cross-lists / Replacements`;
byId('search').oninput=render;byId('only').onclick=()=>{only=!only;byId('only').setAttribute('aria-pressed',String(only));render();};
byId('download').onclick=()=>download(data.markdown,`${data.date}-arxiv-daily.md`,'text/markdown;charset=utf-8');
byId('export').onclick=()=>download(JSON.stringify(favorites,null,2),'arxiv-favorites.json','application/json');
byId('exportmd').onclick=()=>download('# 收藏文献\n\n'+Object.values(favorites).map(p=>`- [ ] [${p.title}](${p.url}) — ${p.arxiv_id}`).join('\n')+'\n','arxiv-favorites.md','text/markdown;charset=utf-8');
byId('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('文件超过 5 MB');const items=JSON.parse(await file.text());if(!items||Array.isArray(items)||typeof items!=='object')throw Error('应为收藏 JSON 对象');const clean={};for(const [id,p]of Object.entries(items)){if(!/^(\d{4}\.\d{4,5}|[a-zA-Z.-]+\/\d{7})$/.test(id)||!p||typeof p.title!=='string')throw Error('收藏记录格式不正确');clean[id]={arxiv_id:id,title:p.title,url:'https://arxiv.org/abs/'+id,note:typeof p.note==='string'?p.note:'',status:'to_read'};}favorites={...favorites,...clean};persist();render();}catch(error){byId('status').textContent='导入失败：'+error.message;}e.target.value='';};
render();
</script></html>
